services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: study_assistant
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study_dev_password
    ports:
      - "5432:5432"
    volumes:
      - study_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - study_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  study_postgres:
  study_redis:
